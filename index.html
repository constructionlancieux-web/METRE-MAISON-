<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Métré Façade Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRE D'OUTILS HAUTE */
    header {
      background: #1e293b;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 2px solid #334155;
      flex-shrink: 0;
      z-index: 20;
    }
    .btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-photo { background: #2563eb; border-color: #60a5fa; color: white; }
    .btn-reset { background: #d97706; border-color: #f59e0b; color: white; }
    .btn-del { background: #dc2626; border-color: #ef4444; color: white; }
    .btn-export { background: #059669; border-color: #10b981; color: white; }

    /* ZONE DE VISUALISATION */
    #canvas-container {
      flex: 1 1 auto;
      position: relative;
      background: #020617;
      min-height: 0;
      overflow: hidden;
    }
    #facadeCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* DOCK DE SAISIE EN BAS */
    #dock {
      background: #1e293b;
      border-top: 3px solid #facc15;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      z-index: 20;
    }
    .dock-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #facc15;
      color: #000;
      font-weight: 900;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 70px;
      text-align: center;
    }
    .val-input {
      flex: 1;
      background: #0f172a;
      border: 2px solid #facc15;
      border-radius: 8px;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      padding: 6px 10px;
      outline: none;
    }
    .val-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
    }
    .btn-mic {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-mic.listening {
      background: #16a34a;
      animation: blink 0.8s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.7; } to { opacity: 1; transform: scale(1.02); } }

    .dock-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-nav {
      background: #334155;
      border: 1px solid #64748b;
      color: #fff;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .counter {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <label class="btn btn-photo">
      📷 Charger Photo
      <input type="file" id="photo-input" accept="image/*" capture="environment" style="display:none">
    </label>
    <button class="btn btn-reset" id="btn-prequote">⚡ Cotes Façade</button>
    <button class="btn" id="btn-add-window">+ Fenêtre</button>
    <button class="btn" id="btn-add-free">+ Cote Libre</button>
    <button class="btn btn-del" id="btn-del">🗑️ Suppr</button>
    <button class="btn btn-export" id="btn-export">💾 Exporter Image</button>
  </header>

  <div id="canvas-container">
    <canvas id="facadeCanvas"></canvas>
  </div>

  <div id="dock">
    <div class="dock-top">
      <div class="badge" id="badge-cote">#1</div>
      <input type="text" id="cote-val" class="val-input" placeholder="Ex: 325 ou 3.25" inputmode="decimal">
      <button class="btn-mic" id="btn-mic">🎤 Dicter</button>
    </div>
    <div class="dock-bottom">
      <button class="btn-nav" id="btn-prev">⬅️ Précédente</button>
      <div class="counter" id="counter-txt">1 / 1 cotes</div>
      <button class="btn-nav" id="btn-next">Suivante ➡️</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('facadeCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    let loadedPhoto = null;
    let arrows = [];
    let selectedId = null;
    let dragging = null;
    let idSeq = 1;
    let freeMode = false;
    let freeStart = null;

    function syncSize() {
      const rect = container.getBoundingClientRect();
      const w = Math.floor(rect.width);
      const h = Math.floor(rect.height);
      if (w <= 0 || h <= 0) return;

      if (canvas.width !== w || canvas.height !== h) {
        const oldW = canvas.width;
        const oldH = canvas.height;
        canvas.width = w;
        canvas.height = h;

        if (oldW > 0 && oldH > 0) {
          const rx = w / oldW;
          const ry = h / oldH;
          arrows.forEach(a => {
            a.p1.x *= rx; a.p1.y *= ry;
            a.p2.x *= rx; a.p2.y *= ry;
          });
        }
      }

      if (arrows.length === 0) {
        setupDefaultCotes();
      }
      render();
    }

    window.addEventListener('resize', syncSize);

    function setupDefaultCotes() {
      arrows = [];
      idSeq = 1;
      const w = canvas.width || 800;
      const h = canvas.height || 600;

      // 1. Longueur basse (sol / soubassement)
      addArrow(w * 0.16, h * 0.84, w * 0.84, h * 0.84, 'red', '');

      // 2. Hauteur égout gauche
      addArrow(w * 0.16, h * 0.84, w * 0.16, h * 0.44, 'blue', '');

      // 3. Hauteur faîtage / cintre central (verticale pure)
      addArrow(w * 0.50, h * 0.84, w * 0.50, h * 0.16, 'blue', '');

      // 4. Hauteur égout droit
      addArrow(w * 0.84, h * 0.84, w * 0.84, h * 0.44, 'blue', '');

      // 5. Baies / Fenêtres Étage
      addWindowCotes(w * 0.28, h * 0.26, w * 0.12, h * 0.15);
      addWindowCotes(w * 0.60, h * 0.26, w * 0.12, h * 0.15);

      // 6. Baies / Fenêtres RDC
      addWindowCotes(w * 0.27, h * 0.52, w * 0.14, h * 0.18);
      addWindowCotes(w * 0.58, h * 0.50, w * 0.17, h * 0.22);

      selectedId = arrows[0] ? arrows[0].id : null;
    }

    function addWindowCotes(x, y, w, h) {
      addArrow(x, y - 8, x + w, y - 8, 'red', '');
      addArrow(x + w + 8, y, x + w + 8, y + h, 'blue', '');
    }

    function addArrow(x1, y1, x2, y2, color, val) {
      arrows.push({
        id: idSeq++,
        p1: { x: x1, y: y1 },
        p2: { x: x2, y: y2 },
        color: color || 'red',
        value: val || ''
      });
      selectedId = arrows[arrows.length - 1].id;
    }

    document.getElementById('photo-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          loadedPhoto = img;
          setupDefaultCotes();
          render();
          updateDock();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btn-prequote').addEventListener('click', () => {
      setupDefaultCotes();
      render();
      updateDock();
    });

    document.getElementById('btn-add-window').addEventListener('click', () => {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      addWindowCotes(cx - 40, cy - 40, 80, 90);
      render();
      updateDock();
    });

    document.getElementById('btn-add-free').addEventListener('click', () => {
      freeMode = true;
      alert("Glissez votre doigt ou la souris sur la façade pour créer votre cote.");
    });

    document.getElementById('btn-del').addEventListener('click', () => {
      if (!selectedId) return;
      arrows = arrows.filter(a => a.id !== selectedId);
      selectedId = arrows.length ? arrows[0].id : null;
      render();
      updateDock();
    });

    function render() {
      const w = canvas.width;
      const h = canvas.height;
      if (w <= 0 || h <= 0) return;

      ctx.clearRect(0, 0, w, h);

      if (loadedPhoto) {
        const ratio = Math.min(w / loadedPhoto.width, h / loadedPhoto.height);
        const nw = loadedPhoto.width * ratio;
        const nh = loadedPhoto.height * ratio;
        const ox = (w - nw) / 2;
        const oy = (h - nh) / 2;
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(loadedPhoto, ox, oy, nw, nh);
      } else {
        drawVectorFaçade(w, h);
      }

      arrows.forEach(arr => {
        const isSel = (arr.id === selectedId);
        const { p1, p2, color, value } = arr;
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const headlen = 11;

        ctx.save();
        ctx.strokeStyle = isSel ? '#ffffff' : (color === 'blue' ? '#3b82f6' : '#ef4444');
        ctx.lineWidth = isSel ? 3.5 : 2.5;

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        drawTip(p1.x, p1.y, angle + Math.PI, headlen);
        drawTip(p2.x, p2.y, angle, headlen);

        ctx.fillStyle = isSel ? '#facc15' : '#ffffff';
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, 6, 0, Math.PI * 2);
        ctx.arc(p2.x, p2.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const text = value ? String(value) : '...';

        ctx.font = 'bold 13px sans-serif';
        const tw = ctx.measureText(text).width;
        const bw = Math.max(36, tw + 14);
        const bh = 22;

        ctx.fillStyle = isSel ? '#fef08a' : '#fde047';
        ctx.strokeStyle = isSel ? '#000000' : '#854d0e';
        ctx.lineWidth = isSel ? 2 : 1;
        drawPill(midX - bw/2, midY - bh/2, bw, bh, 4);

        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, midX, midY);

        ctx.restore();
      });
    }

    function drawVectorFaçade(w, h) {
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, h * 0.84, w, h * 0.16);

      ctx.beginPath();
      ctx.moveTo(w * 0.16, h * 0.84);
      ctx.lineTo(w * 0.16, h * 0.44);
      ctx.lineTo(w * 0.50, h * 0.16);
      ctx.lineTo(w * 0.84, h * 0.44);
      ctx.lineTo(w * 0.84, h * 0.84);
      ctx.closePath();
      ctx.fillStyle = '#e2e8f0';
      ctx.fill();
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(w * 0.16, h * 0.72, w * 0.68, h * 0.12);
      ctx.strokeRect(w * 0.16, h * 0.72, w * 0.68, h * 0.12);

      ctx.beginPath();
      ctx.moveTo(w * 0.14, h * 0.45);
      ctx.lineTo(w * 0.50, h * 0.14);
      ctx.lineTo(w * 0.86, h * 0.45);
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 8;
      ctx.stroke();

      drawWinBox(w * 0.28, h * 0.26, w * 0.12, h * 0.15);
      drawWinBox(w * 0.60, h * 0.26, w * 0.12, h * 0.15);
      drawWinBox(w * 0.27, h * 0.52, w * 0.14, h * 0.18);
      drawWinBox(w * 0.58, h * 0.50, w * 0.17, h * 0.22);
    }

    function drawWinBox(x, y, w, h) {
      ctx.fillStyle = '#93c5fd';
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = '#1d4ed8';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x, y, w, h);
    }

    function drawTip(x, y, rad, len) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - len * Math.cos(rad - Math.PI / 6), y - len * Math.sin(rad - Math.PI / 6));
      ctx.moveTo(x, y);
      ctx.lineTo(x - len * Math.cos(rad + Math.PI / 6), y - len * Math.sin(rad + Math.PI / 6));
      ctx.stroke();
    }

    function drawPill(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function getPointer(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const pos = getPointer(e);

      if (freeMode) {
        freeStart = pos;
        return;
      }

      for (let arr of arrows) {
        if (Math.hypot(arr.p1.x - pos.x, arr.p1.y - pos.y) < 22) {
          dragging = { arr, pt: 'p1' };
          selectedId = arr.id;
          updateDock();
          render();
          return;
        }
        if (Math.hypot(arr.p2.x - pos.x, arr.p2.y - pos.y) < 22) {
          dragging = { arr, pt: 'p2' };
          selectedId = arr.id;
          updateDock();
          render();
          return;
        }
      }

      for (let arr of arrows) {
        const mx = (arr.p1.x + arr.p2.x) / 2;
        const my = (arr.p1.y + arr.p2.y) / 2;
        if (Math.hypot(mx - pos.x, my - pos.y) < 24) {
          selectedId = arr.id;
          updateDock();
          render();
          return;
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (dragging) {
        const pos = getPointer(e);
        dragging.arr[dragging.pt] = pos;
        render();
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (freeMode && freeStart) {
        const pos = getPointer(e);
        if (Math.hypot(pos.x - freeStart.x, pos.y - freeStart.y) > 20) {
          const isV = Math.abs(pos.y - freeStart.y) > Math.abs(pos.x - freeStart.x);
          addArrow(freeStart.x, freeStart.y, pos.x, pos.y, isV ? 'blue' : 'red', '');
        }
        freeMode = false;
        freeStart = null;
        render();
        updateDock();
      }
      dragging = null;
    });

    const badgeCote = document.getElementById('badge-cote');
    const coteVal = document.getElementById('cote-val');
    const counterTxt = document.getElementById('counter-txt');

    function updateDock() {
      const idx = arrows.findIndex(a => a.id === selectedId);
      if (idx !== -1) {
        badgeCote.textContent = `#${arrows[idx].id}`;
        coteVal.value = arrows[idx].value || '';
        counterTxt.textContent = `${idx + 1} / ${arrows.length} cotes`;
      } else {
        badgeCote.textContent = '#--';
        coteVal.value = '';
        counterTxt.textContent = `0 / ${arrows.length} cotes`;
      }
    }

    coteVal.addEventListener('input', (e) => {
      const arr = arrows.find(a => a.id === selectedId);
      if (arr) {
        arr.value = e.target.value;
        render();
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (!arrows.length) return;
      const idx = arrows.findIndex(a => a.id === selectedId);
      selectedId = arrows[(idx + 1) % arrows.length].id;
      updateDock();
      render();
      coteVal.focus();
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (!arrows.length) return;
      const idx = arrows.findIndex(a => a.id === selectedId);
      selectedId = arrows[(idx - 1 + arrows.length) % arrows.length].id;
      updateDock();
      render();
      coteVal.focus();
    });

    // DICTÉE VOCALE CHANTIER
    const btnMic = document.getElementById('btn-mic');
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (Speech) {
      const rec = new Speech();
      rec.lang = 'fr-FR';
      rec.continuous = false;

      btnMic.addEventListener('click', () => {
        try {
          rec.start();
          btnMic.classList.add('listening');
          btnMic.textContent = 'Écoute...';
        } catch(e) {
          rec.stop();
        }
      });

      rec.onresult = (e) => {
        let txt = e.results[0][0].transcript.toLowerCase();
        txt = txt.replace(/mètres?/g, '.').replace(/virgule/g, '.').replace(/\s+/g, '');
        coteVal.value = txt;
        const arr = arrows.find(a => a.id === selectedId);
        if (arr) {
          arr.value = txt;
          render();
        }
        setTimeout(() => document.getElementById('btn-next').click(), 400);
      };

      rec.onend = () => {
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤 Dicter';
      };
      rec.onerror = () => {
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤 Dicter';
      };
    } else {
      btnMic.style.display = 'none';
    }

    // EXPORT IMAGE
    document.getElementById('btn-export').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `releve-facade-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    });

    window.addEventListener('DOMContentLoaded', syncSize);
    setTimeout(syncSize, 100);
  </script>
</body>
</html>
