<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Métré façade</title>
<style>
:root{--bg:#2f353f;--pn:#3a414d;--ac:#c3d600;--tx:#f2f4f7;--mu:#9aa3b2}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif}
header{display:flex;gap:6px;padding:8px;background:var(--pn);align-items:center}
#tabs{display:flex;gap:6px;flex:1;overflow-x:auto}
button,.b,select{font:inherit;background:#4a5260;color:var(--tx);border:0;border-radius:8px;padding:10px 12px;cursor:pointer;white-space:nowrap}
button.on{background:var(--ac);color:#1d2127;font-weight:700}
.b{background:var(--ac);color:#1d2127;font-weight:700}
main{flex:1;min-height:0;position:relative}
#wrap{position:absolute;inset:0;overflow:auto;background:#22262d}
#cv{display:block;width:100%;background:#fff}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px}
#empty .b{font-size:18px;padding:16px 22px}
#empty p{color:var(--mu);max-width:36ch;margin:0}
footer{background:var(--pn);padding:8px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.r p{margin:0;color:var(--mu);flex:1 1 100%}
#ig{display:flex;gap:6px;overflow-x:auto}
#ig button{min-width:44px;padding:8px;background:var(--ac);color:#1d2127;font-weight:700}
#ig button.on{outline:3px solid #fff}
[hidden]{display:none!important}
</style></head><body>
<header><div id="tabs"></div><button id="pre">Dessin préparé</button><label class="b">+ Photos<input id="fi" type="file" accept="image/*" multiple hidden></label></header>
<main>
 <div id="wrap"><canvas id="cv"></canvas></div>
 <div id="empty"><label class="b">Ajouter des photos de la façade<input id="fi2" type="file" accept="image/*" multiple hidden></label><p>Vous repassez les arêtes sur la photo. L’appli en fait un dessin propre, avec une flèche le long de chaque arête pour y saisir la cote.</p></div>
</main>
<footer id="p" hidden>
 <div class="r"><p id="hint"></p></div>
 <div class="r" id="modes">
  <button data-m="poly" class="on">Tracer</button><button data-m="move">Déplacer</button><button data-m="icon">Point singulier</button><button data-m="note">Note</button><button data-m="del">Supprimer</button>
 </div>
 <div class="r"><select id="ty"></select><button id="cl">Fermer la forme</button><button id="un">Annuler</button><button id="bg">Fond : photo</button><button id="seq">Saisir les cotes</button><button id="zo">Zoom −</button><button id="zi">Zoom +</button><button id="sv" class="on">Enregistrer / envoyer</button></div>
 <div id="ig" hidden></div>
</footer>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d');
const TYPES={mur:['Contour du mur','#1f2430'],ouv:['Ouverture (fenêtre, porte)','#1976d2'],ren:['Renfoncement / saillie','#e65100'],toit:['Toit, mur voisin, obstacle','#c62828']};
const ICONS=[['#','Grille de défense'],['⌇','Rampe'],['▬','Store banne'],['📡','Parabole'],['💡','Éclairage'],['⬇','Descente EP'],['🏭','Carré de cheminée'],['INT','Garde-corps intérieur'],['EXT','Garde-corps extérieur'],['⎍','Escalier'],['C','Entourage de chevrons'],['P','Entourage de pannes'],['X','Pannes spéciales'],['MP','Manchonnage de pannes'],['⌐','Habillage de rives'],['G','Gonds'],['⚡','Protection EDF'],['€','Plus-value spéciale'],['🔧','Éléments divers'],['✺','Grille de ventilation'],['⏱','Temps de démontage'],['↕','Profil de jonction'],['💧','Point d’eau'],['❄','Groupe climatisation']];
const BG=[['photo',1],['photo pâle',.3],['aucun',0]],HINTS={poly:'Touchez chaque coin du mur sur la photo, dans l’ordre. Touchez le premier point pour fermer. Une flèche apparaît le long de chaque arête : touchez-la pour saisir la cote.',move:'Faites glisser un point, un pictogramme ou une note.',icon:'Choisissez un pictogramme puis touchez l’endroit sur la façade.',note:'Touchez l’endroit où poser la note.',del:'Touchez un point, un pictogramme ou une note pour le supprimer.'};
let faces=[],cur=-1,mode='poly',icon=0,zoom=1,bg=0,hits=[],drag=null,down=null,hl=null;
const F=()=>faces[cur];
$('#ty').innerHTML=Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');
$('#ig').innerHTML=ICONS.map((c,i)=>`<button data-i="${i}" title="${c[1]}">${c[0]}</button>`).join('');

async function add(files){
 for(const f of files){const bm=await createImageBitmap(f),k=Math.min(1,2000/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  faces.push({src:c,shapes:[],icons:[],notes:[],order:[]});}
 cur=faces.length-1;show();
}
$('#fi').onchange=$('#fi2').onchange=e=>{add([...e.target.files]);e.target.value=''};

/* --- dessins préparés (en cm, échelle 1,5 px/cm) --- */
const P=(u,v)=>[110+u*1.5,140+v*1.5],R=(a,b,c,d)=>[P(a,b),P(c,b),P(c,d),P(a,d)];
const PRESETS=[{name:'Lanfains',W:1660,H:1520,
 shapes:[
  {t:'mur',pts:[P(0,0),P(960,0),P(960,452),P(919,452),P(919,311.7),P(687,311.7),P(687,452),P(540,452),P(540,309.3),P(441,309.3),P(441,452),P(0,452)]},
  {t:'ouv',pts:R(127,56,277,196)},{t:'ouv',pts:R(442,56,522,196)},{t:'ouv',pts:R(724,56,874,196)},{t:'ouv',pts:R(127,312,277,452)},
  {t:'mur',pts:R(40,580,103,845)},{t:'mur',pts:R(380,580,443,845)}],
 icons:[[...P(482,255),4],[...P(12,380),5]],
 notes:[[330,45,'FACADE AVANT SUD'],[...P(780,254),'Bandeau entre étages'],[420,1250,'SAS 1'],[880,1250,'SAS 2'],[1230,1300,'2 panneaux amovibles collés en haut des SAS']]}];
$('#pre').onclick=()=>{
 const p=PRESETS[0],c=document.createElement('canvas');c.width=p.W;c.height=p.H;
 const cl=a=>JSON.parse(JSON.stringify(a));
 faces.push({name:p.name,src:c,shapes:cl(p.shapes).map(s=>({...s,closed:true,lab:{}})),icons:cl(p.icons),notes:cl(p.notes),order:[]});
 cur=faces.length-1;bg=2;show();
};

function show(){
 $('#tabs').innerHTML=faces.map((f,i)=>`<button data-t="${i}" class="${i==cur?'on':''}">${f.name||'Face '+(i+1)}</button>`).join('');
 const f=F();$('#empty').hidden=!!f;$('#wrap').hidden=!f;$('#p').hidden=!f;if(!f)return;
 cv.width=f.src.width;cv.height=f.src.height;cv.style.width=zoom*100+'%';
 cv.style.touchAction=mode=='move'?'none':'manipulation';
 $('#ig').hidden=mode!='icon';$('#hint').textContent=HINTS[mode];$('#bg').textContent='Fond : '+BG[bg][0];
 document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m==mode));
 draw();
}
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t!=null){cur=+t;show()}};

function ah(x,y,ux,uy,z){cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-ux*z-uy*z*.35,y-uy*z+ux*z*.35);cx.lineTo(x-ux*z+uy*z*.35,y-uy*z-ux*z*.35);cx.closePath();cx.fill()}
function draw(exp){
 const f=F();if(!f)return;const W=cv.width,fs=Math.max(16,W/60);
 cx.fillStyle='#fff';cx.fillRect(0,0,W,cv.height);
 if(!exp&&BG[bg][1]){cx.globalAlpha=BG[bg][1];cx.drawImage(f.src,0,0);cx.globalAlpha=1}
 hits=[];cx.textAlign='center';cx.textBaseline='middle';
 f.shapes.forEach((sh,si)=>{
  const c=TYPES[sh.t][1],P=sh.pts,n=P.length;
  cx.lineWidth=fs/4;cx.strokeStyle=c;cx.fillStyle=c+(sh.t=='mur'?'12':'26');cx.lineJoin='round';
  cx.beginPath();P.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));
  if(sh.closed){cx.closePath();cx.fill()}cx.stroke();
  if(!exp){cx.fillStyle=c;P.forEach(p=>{cx.beginPath();cx.arc(p[0],p[1],fs/2,0,7);cx.fill()})}
  let ar=0;P.forEach((p,i)=>{const q=P[(i+1)%n];ar+=p[0]*q[1]-q[0]*p[1]});
  for(let i=0;i<(sh.closed?n:n-1);i++){
   const a=P[i],b=P[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);if(L<4)continue;
   const ux=dx/L,uy=dy/L,nx=ar>0?uy:-uy,ny=ar>0?-ux:ux,o=fs*(sh.t=='mur'?1.9:1.5);
   const ax=a[0]+nx*o,ay=a[1]+ny*o,bx=b[0]+nx*o,by=b[1]+ny*o,on=hl&&hl.si==si&&hl.i==i;
   cx.lineWidth=on?fs/4:fs/10;cx.strokeStyle=cx.fillStyle=on?'#e91e63':c;cx.beginPath();
   cx.moveTo(a[0]+nx*fs*.3,a[1]+ny*fs*.3);cx.lineTo(ax+nx*fs*.4,ay+ny*fs*.4);cx.moveTo(b[0]+nx*fs*.3,b[1]+ny*fs*.3);cx.lineTo(bx+nx*fs*.4,by+ny*fs*.4);cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke();
   ah(ax,ay,-ux,-uy,fs*.9);ah(bx,by,ux,uy,fs*.9);
   const v=sh.lab[i]||'',mx=(ax+bx)/2,my=(ay+by)/2;cx.font='bold '+fs+'px system-ui';
   const w=Math.max(fs*2.6,cx.measureText(v).width+fs),h=fs*1.5;
   cx.fillStyle=v?'#fff':(exp?'#fff':'#fff59d');cx.fillRect(mx-w/2,my-h/2,w,h);
   cx.lineWidth=fs/12;cx.strokeStyle=on?'#e91e63':c;cx.strokeRect(mx-w/2,my-h/2,w,h);
   cx.fillStyle='#111';cx.fillText(v,mx,my);
   hits.push({si,i,x:mx,y:my,w,h,cur:v});
  }});
 f.icons.forEach(p=>{const z=fs*2.2,t=ICONS[p[2]][0];cx.fillStyle='#c3d600';cx.fillRect(p[0]-z/2,p[1]-z/2,z,z);cx.strokeStyle='#1d2127';cx.lineWidth=fs/14;cx.strokeRect(p[0]-z/2,p[1]-z/2,z,z);cx.fillStyle='#1d2127';cx.font='bold '+fs*(t.length>1&&/^[A-Z]+$/.test(t)?.85:1.3)+'px system-ui';cx.fillText(t,p[0],p[1])});
 f.notes.forEach(p=>{cx.font='bold '+fs+'px system-ui';const w=cx.measureText(p[2]).width+fs,h=fs*1.8;cx.fillStyle='#fff59d';cx.fillRect(p[0]-w/2,p[1]-h/2,w,h);cx.strokeStyle='#999';cx.lineWidth=fs/14;cx.strokeRect(p[0]-w/2,p[1]-h/2,w,h);cx.fillStyle='#000';cx.fillText(p[2],p[0],p[1])});
}

const pt=e=>{const r=cv.getBoundingClientRect(),k=cv.width/r.width;return[(e.clientX-r.left)*k,(e.clientY-r.top)*k,k]};
const moved=e=>down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>10;
function nearest(f,x,y,th){
 let best=null,d=th;
 const chk=(p,list,sh)=>{const dd=Math.hypot(p[0]-x,p[1]-y);if(dd<d){d=dd;best={p,list,sh}}};
 f.shapes.forEach(sh=>sh.pts.forEach(p=>chk(p,sh.pts,sh)));f.icons.forEach(p=>chk(p,f.icons));f.notes.forEach(p=>chk(p,f.notes));return best}
cv.onpointerdown=e=>{
 const f=F();if(!f)return;const[x,y,k]=pt(e);down={x:e.clientX,y:e.clientY};
 if(mode=='move'){drag=nearest(f,x,y,40*k);if(drag)cv.setPointerCapture(e.pointerId)}
};
cv.onpointermove=e=>{if(!drag)return;const[x,y]=pt(e);drag.p[0]=x;drag.p[1]=y;draw()};
cv.onpointerup=e=>{
 const f=F();if(!f)return;const was=drag;drag=null;const[x,y,k]=pt(e),th=36*k;
 if(was){draw();return}if(moved(e))return;
 for(const h of hits)if(Math.abs(x-h.x)<h.w/2&&Math.abs(y-h.y)<h.h/2){ask(h.si,h.i);draw();return}
 if(mode=='icon'){f.icons.push([x,y,icon]);f.order.push('icons')}
 else if(mode=='note'){const t=prompt('Texte de la note');if(t){f.notes.push([x,y,t]);f.order.push('notes')}}
 else if(mode=='del'){const n=nearest(f,x,y,th);if(n){n.list.splice(n.list.indexOf(n.p),1);if(n.sh&&n.sh.pts.length<(n.sh.closed?3:1))f.shapes.splice(f.shapes.indexOf(n.sh),1)}}
 else if(mode=='poly'){
  let sh=f.shapes.find(s=>!s.closed);
  if(!sh){sh={t:$('#ty').value,pts:[],closed:false,lab:{}};f.shapes.push(sh);f.order.push('shapes')}
  const P=sh.pts;
  if(P.length>=3&&Math.hypot(P[0][0]-x,P[0][1]-y)<th){sh.closed=true}
  else{let px=x,py=y;if(P.length){const l=P[P.length-1];if(Math.abs(px-l[0])<th*.7)px=l[0];if(Math.abs(py-l[1])<th*.7)py=l[1]}P.push([px,py])}}
 draw();
};
function ask(si,i){
 const sh=F().shapes[si];hl={si,i};draw();
 const v=prompt('Cote de cette arête (cm)',sh.lab[i]||'');hl=null;
 if(v===null)return false;sh.lab[i]=v.trim();return true;
}
$('#seq').onclick=()=>{const f=F();
 outer:for(let si=0;si<f.shapes.length;si++){const sh=f.shapes[si],n=sh.pts.length;
  for(let i=0;i<(sh.closed?n:n-1);i++){if(!ask(si,i))break outer}}
 hl=null;draw()};
$('#modes').onclick=e=>{const m=e.target.dataset.m;if(m){mode=m;show()}};
$('#ig').onclick=e=>{const b=e.target.closest('button');if(!b)return;icon=+b.dataset.i;document.querySelectorAll('#ig button').forEach(x=>x.classList.toggle('on',x==b))};
$('#cl').onclick=()=>{const sh=F().shapes.find(s=>!s.closed);if(sh&&sh.pts.length>=3)sh.closed=true;draw()};
$('#un').onclick=()=>{const f=F(),sh=f.shapes.find(s=>!s.closed);
 if(sh){sh.pts.pop();if(!sh.pts.length){f.shapes.splice(f.shapes.indexOf(sh),1);f.order.splice(f.order.lastIndexOf('shapes'),1)}}
 else{const l=f.order.pop();if(l)f[l].pop()}draw()};
$('#bg').onclick=()=>{bg=(bg+1)%3;show()};
$('#zi').onclick=()=>{zoom=Math.min(4,zoom+.5);show()};
$('#zo').onclick=()=>{zoom=Math.max(1,zoom-.5);show()};
$('#sv').onclick=()=>{
 draw(true);
 cv.toBlob(async b=>{
  const file=new File([b],'facade-'+(cur+1)+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Métré façade'})}catch(_){}}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file.name;a.click()}
  draw()});
};
show();
</script></body></html>
