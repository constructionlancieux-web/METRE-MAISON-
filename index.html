<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Métré Façade & ITE Pro</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #334155;
      --primary: #3b82f6;
      --accent: #facc15;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRE D'OUTILS HAUTE */
    header {
      background: var(--panel);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid #475569;
      flex-shrink: 0;
    }
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); border-color: #60a5fa; color: white; }
    .btn-accent { background: #ca8a04; border-color: var(--accent); color: white; }
    .btn-danger { background: #991b1b; border-color: var(--danger); color: white; }

    /* ZONE CANVAS / PHOTO */
    #workspace {
      flex: 1;
      position: relative;
      background: #020617;
      overflow: hidden;
      touch-action: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* BANDEAU DE SAISIE BAS */
    #bottom-dock {
      background: var(--panel);
      border-top: 2px solid #475569;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      box-shadow: 0 -8px 20px rgba(0,0,0,0.4);
    }
    .dock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .badge-target {
      background: var(--accent);
      color: #000;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 10px;
      border-radius: 6px;
      min-width: 65px;
      text-align: center;
    }
    .input-box {
      flex: 1;
      background: #0f172a;
      border: 2px solid var(--accent);
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      outline: none;
    }
    .input-box:focus { border-color: #60a5fa; box-shadow: 0 0 10px rgba(96,165,250,0.5); }
    .voice-btn {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .voice-btn.recording {
      background: #16a34a;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.8; } to { opacity: 1; transform: scale(1.02); } }

    .nav-btn {
      background: var(--card);
      border: 1px solid #64748b;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #empty-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #64748b;
      font-size: 16px;
      text-align: center;
      pointer-events: none;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <label class="btn btn-primary">
      📷 Photo Façade
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">
    </label>
    <button class="btn btn-accent" id="btn-prequote">⚡ Pré-coter Façade</button>
    <button class="btn" id="btn-add-window">+ Fenêtre</button>
    <button class="btn" id="btn-add-arrow">+ Cote Libre</button>
    <button class="btn btn-danger" id="btn-del">🗑
