<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Métré Façade Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRE D'OUTILS HAUTE */
    header {
      background: #1e293b;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 2px solid #334155;
      flex-shrink: 0;
      z-index: 10;
    }
    .btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.96); }
    .btn-photo { background: #2563eb; border-color: #60a5fa; color: white; }
    .btn-reset { background: #d97706; border-color: #f59e0b; color: white; }
    .btn-del { background: #dc2626; border-color: #ef4444; color: white; }
    .btn-export { background: #059669; border-color: #10b981; color: white; }

    /* ZONE PRINCIPALE CANVAS */
    #main-container {
      flex: 1 1 auto;
      position: relative;
      background: #020617;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
    }
    #paintCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* BANDEAU BAS PERMANENT */
    #bottom-dock {
      background: #1e293b;
      border-top: 3px solid #facc15;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
      z-index: 10;
    }
    .dock-row-1 {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-id {
      background: #facc15;
      color: #000;
      font-weight: 900;
      font-size: 18px;
      padding: 8px 14px;
      border-radius: 8px;
      min-width: 75px;
      text-align: center;
    }
    .val-input {
      flex: 1;
      background: #0f172a;
      border: 2px solid #facc15;
      border-radius: 8px;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      padding: 8px;
      outline: none;
    }
    .val-input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(96,165,250,0.5);
    }
    .btn-mic {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-mic.listening {
      background: #16a34a;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; transform: scale(1.03); } }

    .dock-row-2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-nav {
      background: #334155;
      border: 1px solid #64748b;
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .counter-info {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <header>
    <label class="btn btn-photo">
      📷 Changer Photo
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">
    </label>
    <button class="btn btn-reset" id="btn-reset">⚡ Réinitialiser Cotes</button>
    <button class="btn" id="btn-add-win">+ Fenêtre</button>
    <button class="btn" id="btn-add-free">+ Cote Libre</button>
    <button class="btn btn-del" id="btn-del">🗑️ Suppr</button>
    <button class="btn btn-export" id="btn-export">💾 Exporter Image</button>
  </header>

  <div id="main-container">
    <canvas id="paintCanvas"></canvas>
  </div>

  <div id="bottom-dock">
    <div class="dock-row-1">
      <div class="badge-id" id="badge-id">#1</div>
      <input type="text" id="input-val" class="val-input" placeholder="Ex: 325 ou 3.25" inputmode="decimal">
      <button class="btn-mic" id="btn-mic">🎤 Dicter</button>
    </div>
    <div class="dock-row-2">
      <button class="btn-nav" id="btn-prev">⬅️ Précédente</button>
      <div class="counter-info" id="counter-info">1 / 1 cotes</div>
      <button class="btn-nav" id="btn-next">Suivante ➡️</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('main-container');

    let loadedImg = null;
    let arrows = [];
    let selectedId = null;
    let draggingHandle = null;
    let arrowCounter = 1;
    let freeMode = false;
    let isDrawingFree = false;
    let freeStart = null;

    // Redimensionnement réel du canvas
    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      canvas.width = rect.width;
      canvas.height = rect.height;

      // Si aucune flèche n'est présente au premier démarrage, créer les cotes
      if (arrows.length === 0) {
        initDefaultPrequote();
      }
      render();
    }

    window.addEventListener('resize', () => {
      const oldW = canvas.width;
      const oldH = canvas.height;
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      if (oldW > 0 && oldH > 0) {
        const rw = canvas.width / oldW;
        const rh = canvas.height / oldH;
        arrows.forEach(a => {
          a.p1.x *= rw; a.p1.y *= rh;
          a.p2.x *= rw; a.p2.y *= rh;
        });
      }
      render();
    });

    // Dessin de fond de maison si aucune photo n'est encore chargée
    function drawFallbackHouse(w, h) {
      // Ciel / Fond
      ctx.fillStyle = '#1e293b';
      ctx.fillRect(0, 0, w, h);

      // Sol herbe
      ctx.fillStyle = '#14532d';
      ctx.fillRect(0, h * 0.85, w, h * 0.15);

      // Façade pignon
      ctx.beginPath();
      ctx.moveTo(w * 0.15, h * 0.85);
      ctx.lineTo(w * 0.15, h * 0.46);
      ctx.lineTo(w * 0.50, h * 0.16);
      ctx.lineTo(w * 0.85, h * 0.46);
      ctx.lineTo(w * 0.85, h * 0.85);
      ctx.closePath();
      ctx.fillStyle = '#e2e8f0';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#334155';
      ctx.stroke();

      // Soubassement
      ctx.fillStyle = '#94a3b8';
      ctx.fillRect(w * 0.15, h * 0.72, w * 0.70, h * 0.13);
      ctx.strokeRect(w * 0.15, h * 0.72, w * 0.70, h * 0.13);

      // Toiture débordante
      ctx.beginPath();
      ctx.moveTo(w * 0.13, h * 0.47);
      ctx.lineTo(w * 0.50, h * 0.14);
      ctx.lineTo(w * 0.87, h * 0.47);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#1e293b';
      ctx.stroke();

      // Fenêtres Étage
      drawWindow(w * 0.26, h * 0.28, w * 0.13, h * 0.16);
      drawWindow(w * 0.61, h * 0.28, w * 0.13, h * 0.16);

      // Baie & Porte RDC
      drawWindow(w * 0.25, h * 0.50, w * 0.15, h * 0.18);
      drawWindow(w * 0.58, h * 0.48, w * 0.18, h * 0.24);
    }

    function drawWindow(x, y, w, h) {
      ctx.fillStyle = '#93c5fd';
      ctx.fillRect(x, y, w, h);
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1d4ed8';
      ctx.strokeRect(x, y, w, h);
    }

    // Chargement de photo par l'utilisateur
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          loadedImg = img;
          initDefaultPrequote();
          render();
          updateDock();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Pré-cotation conforme terrain (zéro rampant, cotes utiles)
    function initDefaultPrequote() {
      arrows = [];
      arrowCounter = 1;
      const w = canvas.width || container.clientWidth || 800;
      const h = canvas.height || container.clientHeight || 600;

      // 1. Longueur basse de la façade
      addArrow(w * 0.15, h * 0.85, w * 0.85, h * 0.85, 'red', '');

      // 2. Hauteur Égout Gauche
      addArrow(w * 0.15, h * 0.85, w * 0.15, h * 0.46, 'blue', '');

      // 3. Hauteur Faîtage / Cintre central (verticale pure, pas de rampant)
      addArrow(w * 0.50, h * 0.85, w * 0.50, h * 0.16, 'blue', '');

      // 4. Hauteur Égout Droit
      addArrow(w * 0.85, h * 0.85, w * 0.85, h * 0.46, 'blue', '');

      // 5. Ouvertures Étage
      addWindowCotes(w * 0.26, h * 0.28, w * 0.13, h * 0.16);
      addWindowCotes(w * 0.61, h * 0.28, w * 0.13, h * 0.16);

      // 6. Ouvertures RDC
      addWindowCotes(w * 0.25, h * 0.50, w * 0.15, h * 0.18);
      addWindowCotes(w * 0.58, h * 0.48, w * 0.18, h * 0.24);

      selectedId = arrows[0] ? arrows[0].id : null;
    }

    function addWindowCotes(x, y, w, h) {
      addArrow(x, y - 10, x + w, y - 10, 'red', '');
      addArrow(x + w + 10, y, x + w + 10, y + h, 'blue', '');
    }

    function addArrow(x1, y1, x2, y2, color, val) {
      arrows.push({
        id: arrowCounter++,
        p1: { x: x1, y: y1 },
        p2: { x: x2, y: y2 },
        color: color || 'red',
        value: val || ''
      });
      selectedId = arrows[arrows.length - 1].id;
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
      initDefaultPrequote();
      render();
      updateDock();
    });

    document.getElementById('btn-add-win').addEventListener('click', () => {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      addWindowCotes(cx - 40, cy - 40, 80, 90);
      render();
      updateDock();
    });

    document.getElementById('btn-add-free').addEventListener('click', () => {
      freeMode = true;
      alert("Glissez votre doigt sur la façade pour positionner la cote.");
    });

    document.getElementById('btn-del').addEventListener('click', () => {
      if (!selectedId) return;
      arrows = arrows.filter(a => a.id !== selectedId);
      selectedId = arrows.length ? arrows[0].id : null;
      render();
      updateDock();
    });

    // MOTEUR DE DESSIN CANVAS
    function render() {
      const w = canvas.width;
      const h = canvas.height;
      if (w === 0 || h === 0) return;

      ctx.clearRect(0, 0, w, h);

      if (loadedImg) {
        // Ajustement proportionnel de la photo dans le canvas
        const ratio = Math.min(w / loadedImg.width, h / loadedImg.height);
        const nw = loadedImg.width * ratio;
        const nh = loadedImg.height * ratio;
        const ox = (w - nw) / 2;
        const oy = (h - nh) / 2;
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(loadedImg, ox, oy, nw, nh);
      } else {
        // Dessin de façade d'exemple nette
        drawFallbackHouse(w, h);
      }

      // Tracé des cotes et flèches
      arrows.forEach(arr => {
        const isSel = (arr.id === selectedId);
        const { p1, p2, color, value } = arr;
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const headlen = 12;

        ctx.save();
        ctx.strokeStyle = isSel ? '#ffffff' : (color === 'blue' ? '#3b82f6' : '#ef4444');
        ctx.lineWidth = isSel ? 4 : 2.8;

        // Ligne
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        // Flèches pointes aux 2 bouts
        drawTip(p1.x, p1.y, angle + Math.PI, headlen);
        drawTip(p2.x, p2.y, angle, headlen);

        // Poignées interactives aux extrémités
        ctx.fillStyle = isSel ? '#facc15' : '#ffffff';
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, 7, 0, Math.PI * 2);
        ctx.arc(p2.x, p2.y, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Pastille Jaune fluo
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const text = value ? String(value) : '...';

        ctx.font = 'bold 14px sans-serif';
        const tw = ctx.measureText(text).width;
        const bw = Math.max(38, tw + 16);
        const bh = 24;

        ctx.fillStyle = isSel ? '#fef08a' : '#fde047';
        ctx.strokeStyle = isSel ? '#000000' : '#854d0e';
        ctx.lineWidth = isSel ? 2.5 : 1.2;
        roundBox(ctx, midX - bw/2, midY - bh/2, bw, bh, 5);

        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, midX, midY);

        ctx.restore();
      });
    }

    function drawTip(x, y, rad, len) {
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - len * Math.cos(rad - Math.PI / 6), y - len * Math.sin(rad - Math.PI / 6));
      ctx.moveTo(x, y);
      ctx.lineTo(x - len * Math.cos(rad + Math.PI / 6), y - len * Math.sin(rad + Math.PI / 6));
      ctx.stroke();
    }

    function roundBox(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // GESTION TACTILE & SOURIS
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: cx - rect.left, y: cy - rect.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      const pos = getPointerPos(e);

      if (freeMode) {
        freeStart = pos;
        isDrawingFree = true;
        return;
      }

      // Poignées touchées
      for (let arr of arrows) {
        if (Math.hypot(arr.p1.x - pos.x, arr.p1.y - pos.y) < 24) {
          draggingHandle = { arr, pt: 'p1' };
          selectedId = arr.id;
          updateDock();
          render();
          return;
        }
        if (Math.hypot(arr.p2.x - pos.x, arr.p2.y - pos.y) < 24) {
          draggingHandle = { arr, pt: 'p2' };
          selectedId = arr.id;
          updateDock();
          render();
          return;
        }
      }

      // Pastilles jaunes touchées
      for (let arr of arrows) {
        const mx = (arr.p1.x + arr.p2.x) / 2;
        const my = (arr.p1.y + arr.p2.y) / 2;
        if (Math.hypot(mx - pos.x, my - pos.y) < 26) {
          selectedId = arr.id;
          updateDock();
          render();
          return;
        }
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (draggingHandle) {
        const pos = getPointerPos(e);
        draggingHandle.arr[draggingHandle.pt] = pos;
        render();
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (freeMode && isDrawingFree && freeStart) {
        const pos = getPointerPos(e);
        if (Math.hypot(pos.x - freeStart.x, pos.y - freeStart.y) > 20) {
          const isV = Math.abs(pos.y - freeStart.y) > Math.abs(pos.x - freeStart.x);
          addArrow(freeStart.x, freeStart.y, pos.x, pos.y, isV ? 'blue' : 'red', '');
        }
        freeMode = false;
        isDrawingFree = false;
        freeStart = null;
        render();
        updateDock();
      }
      draggingHandle = null;
    });

    // SAISIE & BANDEAU BAS
    const badgeId = document.getElementById('badge-id');
    const inputVal = document.getElementById('input-val');
    const counterInfo = document.getElementById('counter-info');

    function updateDock() {
      const idx = arrows.findIndex(a => a.id === selectedId);
      if (idx !== -1) {
        badgeId.textContent = `#${arrows[idx].id}`;
        inputVal.value = arrows[idx].value || '';
        counterInfo.textContent = `${idx + 1} / ${arrows.length} cotes`;
      } else {
        badgeId.textContent = '#--';
        inputVal.value = '';
        counterInfo.textContent = `0 / ${arrows.length} cotes`;
      }
    }

    inputVal.addEventListener('input', (e) => {
      const arr = arrows.find(a => a.id === selectedId);
      if (arr) {
        arr.value = e.target.value;
        render();
      }
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (!arrows.length) return;
      const idx = arrows.findIndex(a => a.id === selectedId);
      selectedId = arrows[(idx + 1) % arrows.length].id;
      updateDock();
      render();
      inputVal.focus();
    });

    document.getElementById('btn-prev').addEventListener('click', () => {
      if (!arrows.length) return;
      const idx = arrows.findIndex(a => a.id === selectedId);
      selectedId = arrows[(idx - 1 + arrows.length) % arrows.length].id;
      updateDock();
      render();
      inputVal.focus();
    });

    // DICTEE VOCALE
    const btnMic = document.getElementById('btn-mic');
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (Speech) {
      const rec = new Speech();
      rec.lang = 'fr-FR';
      rec.continuous = false;

      btnMic.addEventListener('click', () => {
        try {
          rec.start();
          btnMic.classList.add('listening');
          btnMic.textContent = 'Écoute...';
        } catch(e) {
          rec.stop();
        }
      });

      rec.onresult = (e) => {
        let txt = e.results[0][0].transcript.toLowerCase();
        txt = txt.replace(/mètres?/g, '.').replace(/virgule/g, '.').replace(/\s+/g, '');
        inputVal.value = txt;
        const arr = arrows.find(a => a.id === selectedId);
        if (arr) {
          arr.value = txt;
          render();
        }
        setTimeout(() => document.getElementById('btn-next').click(), 400);
      };

      rec.onend = () => {
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤 Dicter';
      };
      rec.onerror = () => {
        btnMic.classList.remove('listening');
        btnMic.textContent = '🎤 Dicter';
      };
    } else {
      btnMic.style.display = 'none';
    }

    // EXPORT IMAGE
    document.getElementById('btn-export').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = `releve-facade-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    });

    // Démarrage garanti
    window.addEventListener('DOMContentLoaded', resizeCanvas);
    setTimeout(resizeCanvas, 100);
  </script>
</body>
</html>
