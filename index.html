<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100 select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Métré Chantier Façade - Relevé de Cotes & Dictée Vocale</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: none;
    }

    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scrollbars compactes pour le dock bas */
    ::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }

    @keyframes pulse-mic {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .listening-active {
      animation: pulse-mic 1.2s infinite;
      background-color: #ef4444 !important;
      color: #ffffff !important;
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden bg-slate-950 text-slate-100">

  <!-- ENTÊTE COMPACTE (48px) -->
  <header class="h-12 bg-slate-900 border-b border-slate-800 px-3 flex items-center justify-between z-30 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-7 h-7 rounded-lg bg-amber-500 flex items-center justify-center text-slate-950 font-black">
        <i class="ph-bold ph-ruler text-lg"></i>
      </div>
      <h1 class="text-xs sm:text-sm font-extrabold tracking-tight text-white flex items-center gap-1.5">
        MÉTRÉ CHANTIER
        <span class="text-[10px] text-amber-400 font-mono font-medium px-1.5 py-0.5 rounded bg-amber-400/10 border border-amber-400/20">TERRAIN</span>
      </h1>
    </div>

    <!-- Actions photo & export -->
    <div class="flex items-center gap-1.5">
      <label class="cursor-pointer flex items-center gap-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow">
        <i class="ph-bold ph-camera text-sm"></i>
        <span>Photo</span>
        <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
      </label>

      <label class="cursor-pointer flex items-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2 py-1.5 rounded-lg text-xs font-semibold transition-all">
        <i class="ph-bold ph-image text-sm"></i>
        <span class="hidden sm:inline">Galerie</span>
        <input type="file" id="fileInput" accept="image/*" class="hidden">
      </label>

      <button id="btnAutoDetect" title="Détecter automatiquement les arêtes de façade" class="flex items-center gap-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow">
        <i class="ph-bold ph-magic-wand text-sm"></i>
        <span class="hidden md:inline">Auto-Contours</span>
      </button>

      <button id="btnExport" title="Télécharger l'image cotée" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all shadow">
        <i class="ph-bold ph-download-simple text-sm"></i>
        <span class="hidden sm:inline">Exporter</span>
      </button>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL (70% HAUT CANALISÉ / 30% BAS DOCK) -->
  <div class="flex-1 flex flex-col overflow-hidden relative">

    <!-- ZONE DU HAUT (70%) : CANEVAS DE DESSIN -->
    <div class="relative flex-1 bg-slate-950 overflow-hidden cursor-crosshair" id="canvasContainer">
      <canvas id="viewportCanvas" class="w-full h-full block"></canvas>

      <!-- BARRE D'OUTILS FLOTTANTE GAUCHE -->
      <div class="absolute left-2.5 top-2.5 z-20 flex flex-col gap-1.5">
        <!-- Mode flèche libre -->
        <button id="btnToolDraw" class="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold bg-amber-500 text-slate-950 shadow-lg border border-amber-300 transition-all active:scale-95" title="Cliquer deux points pour poser une flèche">
          <i class="ph-bold ph-vector-three text-base"></i>
          <span class="hidden sm:inline">Tracer Flèche</span>
        </button>

        <!-- Gabarit Pignon rapide -->
        <button id="btnPignonQuick" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-900/90 text-slate-200 hover:bg-slate-800 border border-slate-700 shadow-md transition-all active:scale-95" title="Pose instantanée des cotes d'un pignon (3 hauteurs + base)">
          <i class="ph-bold ph-house text-base text-amber-400"></i>
          <span class="hidden sm:inline">Pignon (3H)</span>
        </button>

        <!-- Gabarit Ouverture (fenêtre/porte) -->
        <button id="btnOpeningQuick" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl text-xs font-bold bg-slate-900/90 text-slate-200 hover:bg-slate-800 border border-slate-700 shadow-md transition-all active:scale-95" title="Ajouter un cadre d'ouverture L x H">
          <i class="ph-bold ph-frame-corners text-base text-cyan-400"></i>
          <span class="hidden sm:inline">+ Ouverture</span>
        </button>

        <!-- Recentrer la photo -->
        <button id="btnCenterView" class="p-2 rounded-xl text-slate-300 bg-slate-900/90 hover:bg-slate-800 border border-slate-700 shadow-md flex items-center justify-center transition-all" title="Recentrer la vue">
          <i class="ph-bold ph-arrows-out text-base"></i>
        </button>
      </div>

      <!-- OUTILS D'ACTIONS SUR LA SÉLECTION (Haut Droite) -->
      <div id="selectionActions" class="hidden absolute right-2.5 top-2.5 z-20 flex items-center gap-1.5 bg-slate-900/90 border border-slate-700 p-1 rounded-xl shadow-lg">
        <button id="btnFlipOffset" title="Inverser le côté du déport de la flèche" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-800 text-slate-200 hover:bg-slate-700">
          Inverser côté
        </button>
        <button id="btnDeleteMeasure" title="Supprimer la flèche active" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-rose-950/70 border border-rose-800 text-rose-300 hover:bg-rose-600 hover:text-white transition-all">
          <i class="ph-bold ph-trash"></i>
        </button>
      </div>

      <!-- Statut Toast & Détection -->
      <div id="statusToast" class="hidden absolute top-3 left-1/2 -translate-x-1/2 z-30 bg-slate-900/95 border border-amber-400/50 text-amber-300 px-3.5 py-1.5 rounded-full text-xs font-semibold shadow-2xl backdrop-blur flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
        <span id="statusToastText">Message</span>
      </div>

      <!-- Mode tracé indicatif -->
      <div id="drawIndicator" class="hidden absolute bottom-3 left-1/2 -translate-x-1/2 z-20 bg-amber-500 text-slate-950 font-bold px-4 py-1.5 rounded-full text-xs shadow-xl flex items-center gap-2">
        <i class="ph-bold ph-cursor-click"></i>
        <span>Touchez ou cliquez sur le 1er angle, puis sur le 2nd angle</span>
      </div>
    </div>

    <!-- ZONE DU BAS (30%) : BANDEAU FIXE DE SAISIE & DICTÉE VOCALE (DOCK BAS) -->
    <footer class="h-44 sm:h-48 md:h-52 bg-slate-900 border-t-2 border-slate-800 flex flex-col shrink-0 z-30 shadow-2xl">
      
      <!-- LIGNE 1 : Saisie ultra rapide & dictée vocale de la flèche active -->
      <div class="px-3 py-2 bg-slate-950/90 border-b border-slate-800 flex items-center justify-between gap-2 shrink-0">
        
        <!-- Repère flèche active -->
        <div class="flex items-center gap-2 shrink-0">
          <span class="text-[10px] text-slate-400 font-extrabold uppercase tracking-wider">Cote active</span>
          <span id="activeBadgeNumber" class="text-xs px-2.5 py-0.5 rounded-md font-mono-num font-black bg-amber-500 text-slate-950">#1</span>
        </div>

        <!-- Champ de saisie direct & Bouton Dictée -->
        <div class="flex items-center gap-2 flex-1 max-w-xl">
          <div class="relative flex-1">
            <input type="text" id="activeMeasureInput" placeholder="Tapez ex: 325 ou 3.25" class="w-full bg-slate-900 border-2 border-amber-500/70 rounded-xl px-3 py-1.5 text-base sm:text-lg font-mono-num font-extrabold text-amber-300 focus:outline-none focus:border-amber-400 tracking-wider">
            <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] font-bold text-slate-500">cm / m</span>
          </div>

          <!-- Gros bouton Dictée vocale -->
          <button id="btnVoiceDock" class="h-10 px-3.5 bg-amber-500 hover:bg-amber-400 active:scale-95 text-slate-950 rounded-xl font-bold flex items-center gap-1.5 shadow-lg shadow-amber-500/20 transition-all shrink-0">
            <i class="ph-bold ph-microphone text-xl"></i>
            <span class="text-xs hidden sm:inline">Dicter</span>
          </button>

          <!-- Valider & Flèche Suivante -->
          <button id="btnNextMeasure" title="Valider et passer à la cote suivante" class="h-10 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl font-bold text-xs flex items-center gap-1 shrink-0">
            <span>Suivante</span>
            <i class="ph-bold ph-arrow-right"></i>
          </button>
        </div>

        <!-- Récapitulatif surface immédiate -->
        <div class="hidden lg:flex items-center gap-4 text-xs font-mono-num shrink-0 text-right pr-2">
          <div>
            <div class="text-[10px] text-slate-500 uppercase">Surface nette</div>
            <div id="statSurfaceNette" class="font-bold text-emerald-400 text-sm">-- m²</div>
          </div>
        </div>
      </div>

      <!-- LIGNE 2 : Carrousel horizontal de toutes les flèches (#1, #2, #3...) -->
      <div class="flex-1 overflow-x-auto overflow-y-hidden p-2 flex items-center gap-2" id="measuresDockContainer">
        <!-- Inséré dynamiquement -->
      </div>
    </footer>
  </div>

  <!-- SCRIPT DE L'APPLICATION -->
  <script>
    /**
     * MÉTRÉ DE FAÇADE PRO & COTATION TERRAIN
     */
    const App = {
      canvas: document.getElementById('viewportCanvas'),
      ctx: null,
      activeMeasureInput: document.getElementById('activeMeasureInput'),
      activeBadgeNumber: document.getElementById('activeBadgeNumber'),
      btnVoiceDock: document.getElementById('btnVoiceDock'),
      btnNextMeasure: document.getElementById('btnNextMeasure'),
      measuresDockContainer: document.getElementById('measuresDockContainer'),
      selectionActions: document.getElementById('selectionActions'),
      drawIndicator: document.getElementById('drawIndicator'),
      statusToast: document.getElementById('statusToast'),
      statusToastText: document.getElementById('statusToastText'),
      statSurfaceNette: document.getElementById('statSurfaceNette'),

      // Image chargée
      image: null,
      imgW: 1200,
      imgH: 800,

      // Vue (Pan & Zoom)
      view: {
        x: 0,
        y: 0,
        scale: 1,
        minScale: 0.15,
        maxScale: 8,
        isPanning: false,
        lastX: 0,
        lastY: 0
      },

      // Liste des cotes
      // Structure : { id, num, p1: {x,y}, p2: {x,y}, offset: number, value: string, numericVal: number|null, color: string, isOpening: boolean }
      measures: [],
      selectedId: null,

      // Mode d'interaction
      currentTool: 'select', // 'select' | 'draw'
      drawStartPoint: null,
      activeDrag: null, // { measure, part: 'p1'|'p2'|'body' }

      // Reconnaissance vocale
      recognition: null,
      isListening: false,

      // Initialisation
      init() {
        this.ctx = this.canvas.getContext('2d');
        this.resizeCanvas();
        window.addEventListener('resize', () => {
          this.resizeCanvas();
          this.render();
        });

        this.initSpeech();
        this.bindEvents();
        this.loadSampleFacade();
      },

      resizeCanvas() {
        const parent = this.canvas.parentElement;
        this.canvas.width = parent.clientWidth;
        this.canvas.height = parent.clientHeight;
      },

      // Centrage de l'image
      fitImage() {
        if (!this.image) return;
        const pad = 30;
        const scaleW = (this.canvas.width - pad * 2) / this.imgW;
        const scaleH = (this.canvas.height - pad * 2) / this.imgH;
        this.view.scale = Math.min(scaleW, scaleH, 1.2);
        this.view.x = (this.canvas.width - this.imgW * this.view.scale) / 2;
        this.view.y = (this.canvas.height - this.imgH * this.view.scale) / 2;
        this.render();
      },

      // Chargement image
      loadImage(src) {
        const img = new Image();
        img.onload = () => {
          this.image = img;
          this.imgW = img.naturalWidth || 1200;
          this.imgH = img.naturalHeight || 800;
          this.fitImage();
        };
        img.src = src;
      },

      // Image par défaut réaliste
      loadSampleFacade() {
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#e0f2fe"/></linearGradient>
            <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
            <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#334155"/><stop offset="100%" stop-color="#0f172a"/></linearGradient>
          </defs>
          <rect width="1200" height="800" fill="url(#sky)"/>
          <rect y="650" width="1200" height="150" fill="#15803d"/>
          <!-- Mur Pignon principal -->
          <polygon points="220,650 220,380 600,150 980,380 980,650" fill="url(#wall)" stroke="#475569" stroke-width="4"/>
          <!-- Rives / Toiture -->
          <polygon points="190,385 600,130 1010,385 980,400 600,165 220,400" fill="url(#roof)"/>
          <!-- Cheminée -->
          <rect x="760" y="160" width="70" height="130" fill="#991b1b" stroke="#450a0a" stroke-width="3"/>
          <rect x="750" y="150" width="90" height="15" fill="#475569"/>
          <!-- Fenêtres Étage -->
          <rect x="370" y="310" width="90" height="120" fill="#0284c7" stroke="#1e293b" stroke-width="6" rx="3"/>
          <rect x="740" y="310" width="90" height="120" fill="#0284c7" stroke="#1e293b" stroke-width="6" rx="3"/>
          <!-- Rez-de-chaussée -->
          <rect x="320" y="490" width="140" height="120" fill="#0284c7" stroke="#1e293b" stroke-width="6" rx="3"/>
          <!-- Porte d'entrée -->
          <rect x="550" y="470" width="100" height="180" fill="#0f172a" stroke="#cbd5e1" stroke-width="6" rx="2"/>
          <circle cx="568" cy="565" r="4" fill="#f59e0b"/>
          <!-- Baie vitrée droite -->
          <rect x="730" y="490" width="160" height="120" fill="#0284c7" stroke="#1e293b" stroke-width="6" rx="3"/>
        </svg>`;
        this.loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg));
      },

      // Coordonnées Image <-> Écran
      toScreen(pt) {
        return {
          x: this.view.x + pt.x * this.view.scale,
          y: this.view.y + pt.y * this.view.scale
        };
      },
      toImage(pt) {
        return {
          x: (pt.x - this.view.x) / this.view.scale,
          y: (pt.y - this.view.y) / this.view.scale
        };
      },

      // Ajout d'une nouvelle flèche
      createMeasure(p1, p2, offset = 35, isOpening = false, color = '#f59e0b') {
        const nextNum = this.measures.length + 1;
        const newM = {
          id: 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
          num: nextNum,
          p1: { x: p1.x, y: p1.y },
          p2: { x: p2.x, y: p2.y },
          offset: offset,
          value: '',
          numericVal: null,
          color: color,
          isOpening: isOpening
        };
        this.measures.push(newM);
        this.selectMeasure(newM.id);
        this.updateDockUI();
        this.render();
        return newM;
      },

      // Sélectionner une flèche
      selectMeasure(id) {
        this.selectedId = id;
        const m = this.measures.find(item => item.id === id);
        if (m) {
          this.activeBadgeNumber.textContent = `#${m.num}`;
          this.activeMeasureInput.value = m.value || '';
          this.selectionActions.classList.remove('hidden');
          // Scroller le dock vers la puce sélectionnée
          const chip = document.getElementById(`dock_chip_${m.id}`);
          if (chip) chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        } else {
          this.selectionActions.classList.add('hidden');
        }
        this.updateDockUI();
        this.render();
      },

      // Mettre à jour la valeur de la cote (en cm ou en m)
      setMeasureValue(id, valStr) {
        const m = this.measures.find(item => item.id === id);
        if (!m) return;
        m.value = valStr.trim();

        // Calcul décimal pour métré
        const clean = valStr.replace(',', '.');
        const match = clean.match(/\d+(?:\.\d+)?/);
        if (match) {
          let num = parseFloat(match[0]);
          // Si saisie en cm (ex: 325 ou 1020), conversion métrique si > 20
          m.numericVal = num > 20 ? (num / 100) : num;
        } else {
          m.numericVal = null;
        }

        this.updateDockUI();
        this.updateCalculations();
        this.render();
      },

      // Passer à la flèche suivante
      goToNextMeasure() {
        if (this.measures.length === 0) return;
        const idx = this.measures.findIndex(m => m.id === this.selectedId);
        const nextIdx = (idx + 1) % this.measures.length;
        this.selectMeasure(this.measures[nextIdx].id);
        this.activeMeasureInput.focus();
        this.activeMeasureInput.select();
      },

      // Supprimer la cote sélectionnée
      deleteSelectedMeasure() {
        if (!this.selectedId) return;
        this.measures = this.measures.filter(m => m.id !== this.selectedId);
        // Ré-indexer les numéros #1, #2, #3...
        this.measures.forEach((m, i) => m.num = i + 1);
        this.selectedId = this.measures.length > 0 ? this.measures[this.measures.length - 1].id : null;
        this.selectMeasure(this.selectedId);
        this.updateDockUI();
        this.updateCalculations();
        this.render();
      },

      // Modèle Pignon rapide (4 flèches de contour typiques)
      applyPignonPreset() {
        if (!this.image) return;
        const w = this.imgW;
        const h = this.imgH;

        // Base & arêtes
        const bX1 = w * 0.18;
        const bX2 = w * 0.82;
        const bY = h * 0.82;
        const eavesY = h * 0.48;
        const peakX = (bX1 + bX2) / 2;
        const peakY = h * 0.19;

        // 1. Base / Longueur
        this.createMeasure({ x: bX1, y: bY }, { x: bX2, y: bY }, 45, false, '#f59e0b');
        // 2. Égout gauche
        this.createMeasure({ x: bX1, y: bY }, { x: bX1, y: eavesY }, -45, false, '#38bdf8');
        // 3. Faîtage central (cintre)
        this.createMeasure({ x: peakX, y: bY }, { x: peakX, y: peakY }, 0, false, '#ec4899');
        // 4. Égout droit
        this.createMeasure({ x: bX2, y: bY }, { x: bX2, y: eavesY }, 45, false, '#38bdf8');

        this.showToast("4 arêtes de pignon créées (#1 à #4). Ajustez les poignées !");
      },

      // Modèle Ouverture rapide (Fenêtre / Porte)
      applyOpeningPreset() {
        if (!this.image) return;
        const cx = this.imgW * 0.5;
        const cy = this.imgH * 0.55;
        const w = this.imgW * 0.11;
        const h = this.imgH * 0.15;

        // Flèche Largeur
        this.createMeasure({ x: cx - w/2, y: cy + h/2 }, { x: cx + w/2, y: cy + h/2 }, 25, true, '#10b981');
        // Flèche Hauteur
        this.createMeasure({ x: cx + w/2, y: cy + h/2 }, { x: cx + w/2, y: cy - h/2 }, 25, true, '#10b981');

        this.showToast("Ouverture ajoutée (Largeur + Hauteur).");
      },

      // DÉTECTION AUTOMATIQUE DES CONTOURS ET ARÊTES
      autoDetectContours() {
        if (!this.image) return;
        this.showToast("Analyse des arêtes et angles de la façade en cours...");

        // Traitement sur canvas hors écran réduit pour la performance
        const offCanvas = document.createElement('canvas');
        const maxDim = 800;
        const scale = Math.min(1, maxDim / Math.max(this.imgW, this.imgH));
        const w = Math.round(this.imgW * scale);
        const h = Math.round(this.imgH * scale);
        offCanvas.width = w;
        offCanvas.height = h;
        const offCtx = offCanvas.getContext('2d');
        offCtx.drawImage(this.image, 0, 0, w, h);

        const imgData = offCtx.getImageData(0, 0, w, h);
        const data = imgData.data;

        // Niveaux de gris & gradient Sobel horizontal + vertical
        const gray = new Float32Array(w * h);
        for (let i = 0; i < data.length; i += 4) {
          gray[i / 4] = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
        }

        // Profils de projection pour trouver les arêtes saillantes du bâtiment
        const colEnergy = new Float32Array(w);
        const rowEnergy = new Float32Array(h);

        for (let y = 1; y < h - 1; y++) {
          for (let x = 1; x < w - 1; x++) {
            const idx = y * w + x;
            const gx = gray[idx + 1] - gray[idx - 1];
            const gy = gray[idx + w] - gray[idx - w];
            const mag = Math.abs(gx) + Math.abs(gy);
            if (mag > 40) {
              colEnergy[x] += mag;
              rowEnergy[y] += mag;
            }
          }
        }

        // Trouver les limites extérieures du bâti
        let minX = Math.round(w * 0.18), maxX = Math.round(w * 0.82);
        let minY = Math.round(h * 0.22), maxY = Math.round(h * 0.82);

        // Détection des pics principaux
        const thresholdX = (colEnergy.reduce((a, b) => a + b, 0) / w) * 1.2;
        for (let x = 10; x < w * 0.45; x++) {
          if (colEnergy[x] > thresholdX) { minX = x; break; }
        }
        for (let x = w - 10; x > w * 0.55; x--) {
          if (colEnergy[x] > thresholdX) { maxX = x; break; }
        }

        // Conversion en coordonnées image d'origine
        const origX1 = minX / scale;
        const origX2 = maxX / scale;
        const origYBase = maxY / scale;
        const origYEaves = (minY / scale) + (origYBase - (minY / scale)) * 0.45;
        const origYPeak = minY / scale;
        const midX = (origX1 + origX2) / 2;

        // Vider ou ajouter les arêtes détectées
        this.measures = [];
        this.createMeasure({ x: origX1, y: origYBase }, { x: origX2, y: origYBase }, 45, false, '#f59e0b');
        this.createMeasure({ x: origX1, y: origYBase }, { x: origX1, y: origYEaves }, -45, false, '#38bdf8');
        this.createMeasure({ x: midX, y: origYBase }, { x: midX, y: origYPeak }, 0, false, '#ec4899');
        this.createMeasure({ x: origX2, y: origYBase }, { x: origX2, y: origYEaves }, 45, false, '#38bdf8');

        // Détection d'une ouverture centrale
        const winW = (origX2 - origX1) * 0.15;
        const winH = (origYBase - origYEaves) * 0.45;
        const winY = origYBase - winH * 1.5;
        this.createMeasure({ x: midX - winW/2, y: winY + winH/2 }, { x: midX + winW/2, y: winY + winH/2 }, 25, true, '#10b981');
        this.createMeasure({ x: midX + winW/2, y: winY + winH/2 }, { x: midX + winW/2, y: winY - winH/2 }, 25, true, '#10b981');

        this.showToast("Contours et arêtes détectés avec succès !");
        this.selectMeasure(this.measures[0].id);
      },

      // Mise à jour de l'affichage du bandeau inférieur (Dock bas)
      updateDockUI() {
        this.measuresDockContainer.innerHTML = '';

        if (this.measures.length === 0) {
          this.measuresDockContainer.innerHTML = `
            <div class="text-xs text-slate-500 py-2 px-3 italic">
              Aucune flèche de cote. Utilisez « Tracer Flèche » ou « Pignon (3H) ».
            </div>`;
          return;
        }

        this.measures.forEach(m => {
          const isSelected = m.id === this.selectedId;
          const chip = document.createElement('div');
          chip.id = `dock_chip_${m.id}`;
          chip.className = `flex-shrink-0 flex items-center gap-2 px-3 py-2 rounded-xl border transition-all cursor-pointer ${
            isSelected
              ? 'bg-amber-500/20 border-amber-400 ring-2 ring-amber-400/30'
              : 'bg-slate-950 border-slate-800 hover:border-slate-700'
          }`;

          chip.innerHTML = `
            <div class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${m.color}"></span>
              <span class="font-mono-num font-black text-xs ${isSelected ? 'text-amber-300' : 'text-slate-300'}">#${m.num}</span>
            </div>
            <div class="font-mono-num font-bold text-xs ${m.value ? 'text-white' : 'text-slate-500'}">
              ${m.value || '--'}
            </div>
          `;

          chip.addEventListener('click', () => {
            this.selectMeasure(m.id);
            this.activeMeasureInput.focus();
            this.activeMeasureInput.select();
          });

          this.measuresDockContainer.appendChild(chip);
        });
      },

      // Mise à jour des calculs de surfaces ITE
      updateCalculations() {
        // Recherche des cotes pignon : #1 (base), #2/#4 (hauteurs égout), #3 (faîtage)
        const base = this.measures[0]?.numericVal;
        const hGauche = this.measures[1]?.numericVal;
        const hCentre = this.measures[2]?.numericVal;
        const hDroite = this.measures[3]?.numericVal;

        let surfaceTotale = 0;
        if (base && hCentre) {
          const hBas = (hGauche && hDroite) ? (hGauche + hDroite) / 2 : (hGauche || hDroite || hCentre * 0.6);
          const hTriangle = Math.max(0, hCentre - hBas);
          surfaceTotale = (base * hBas) + (base * hTriangle / 2);
        } else if (base && (hGauche || hDroite)) {
          surfaceTotale = base * (hGauche || hDroite);
        }

        // Déductions d'ouvertures
        let surfaceOuvertures = 0;
        const openings = this.measures.filter(m => m.isOpening && m.numericVal);
        for (let i = 0; i < openings.length; i += 2) {
          if (openings[i] && openings[i+1]) {
            surfaceOuvertures += (openings[i].numericVal * openings[i+1].numericVal);
          }
        }

        const nette = Math.max(0, surfaceTotale - surfaceOuvertures);
        this.statSurfaceNette.textContent = surfaceTotale > 0 ? `${nette.toFixed(2)} m²` : '-- m²';
      },

      // Reconnaissance vocale automatique pour les chantiers
      initSpeech() {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRec) {
          this.btnVoiceDock.style.display = 'none';
          return;
        }

        this.recognition = new SpeechRec();
        this.recognition.lang = 'fr-FR';
        this.recognition.continuous = false;
        this.recognition.interimResults = false;

        this.recognition.onstart = () => {
          this.isListening = true;
          this.btnVoiceDock.classList.add('listening-active');
          this.showToast("Parlez ! Ex: « trois mètres vingt » ou « 325 »");
        };

        this.recognition.onend = () => {
          this.isListening = false;
          this.btnVoiceDock.classList.remove('listening-active');
        };

        this.recognition.onerror = () => {
          this.isListening = false;
          this.btnVoiceDock.classList.remove('listening-active');
        };

        this.recognition.onresult = (e) => {
          const raw = e.results[0][0].transcript;
          const formatted = this.parseSpokenMeasure(raw);
          if (this.selectedId) {
            this.setMeasureValue(this.selectedId, formatted);
            this.activeMeasureInput.value = formatted;
            // Enchaînement fluide : passage automatique à la flèche suivante
            setTimeout(() => {
              this.goToNextMeasure();
              this.showToast(`Cote #${this.measures.find(m => m.id === this.selectedId)?.num} enregistrée !`);
            }, 300);
          }
        };
      },

      // Traduction automatique du langage de chantier en cote
      parseSpokenMeasure(text) {
        if (!text) return "";
        let str = text.toLowerCase().trim();

        // Remplacement "mètres" ou "virgule"
        str = str.replace(/mètres?|metre|metres/g, '.');
        str = str.replace(/virgule/g, '.');
        str = str.replace(/\s+/g, '');

        // Recherche d'un nombre (ex: "3.25" ou "325")
        const match = str.match(/\d+(?:\.\d+)?/);
        if (match) {
          const val = match[0];
          return val;
        }
        return text;
      },

      // RENDU DU CANEVAS
      render() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

        // 1. Photo de fond
        if (this.image) {
          ctx.save();
          ctx.translate(this.view.x, this.view.y);
          ctx.scale(this.view.scale, this.view.scale);
          ctx.drawImage(this.image, 0, 0, this.imgW, this.imgH);
          ctx.restore();
        }

        // 2. Toutes les lignes de cote
        this.measures.forEach(m => {
          this.drawMeasure(ctx, m, m.id === this.selectedId);
        });

        // 3. Flèche temporaire en cours de tracé
        if (this.currentTool === 'draw' && this.drawStartPoint) {
          const p1 = this.toScreen(this.drawStartPoint);
          ctx.save();
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.arc(p1.x, p1.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = '#f59e0b';
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        }
      },

      // Dessin d'une flèche de cote avec poignées et badge numéro
      drawMeasure(ctx, m, isSelected) {
        const p1 = this.toScreen(m.p1);
        const p2 = this.toScreen(m.p2);

        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const len = Math.hypot(dx, dy);
        if (len < 4) return;

        // Normale unitaire perpendiculaire
        const nx = -dy / len;
        const ny = dx / len;
        const off = m.offset * this.view.scale;

        const c1 = { x: p1.x + nx * off, y: p1.y + ny * off };
        const c2 = { x: p2.x + nx * off, y: p2.y + ny * off };

        ctx.save();

        // Lignes de rappel pointillées
        ctx.beginPath();
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = isSelected ? 'rgba(245, 158, 11, 0.9)' : 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(c1.x + nx * 6, c1.y + ny * 6);
        ctx.moveTo(p2.x, p2.y);
        ctx.lineTo(c2.x + nx * 6, c2.y + ny * 6);
        ctx.stroke();
        ctx.setLineDash([]);

        // Ligne de cote principale
        ctx.beginPath();
        ctx.strokeStyle = isSelected ? '#fbbf24' : m.color;
        ctx.lineWidth = isSelected ? 3.5 : 2.5;
        ctx.moveTo(c1.x, c1.y);
        ctx.lineTo(c2.x, c2.y);
        ctx.stroke();

        // Flèches aux deux extrémités
        const arrowSize = Math.max(9, Math.min(15, 11 * this.view.scale));
        this.drawArrow(ctx, c1, Math.atan2(c2.y - c1.y, c2.x - c1.x), arrowSize, isSelected ? '#fbbf24' : m.color);
        this.drawArrow(ctx, c2, Math.atan2(c1.y - c2.y, c1.x - c2.x), arrowSize, isSelected ? '#fbbf24' : m.color);

        // Badge central : Numéro #X et Valeur
        const mid = { x: (c1.x + c2.x) / 2, y: (c1.y + c2.y) / 2 };
        const text = m.value ? `#${m.num}: ${m.value}` : `#${m.num}`;

        ctx.font = `bold ${Math.max(12, Math.min(16, 14 * Math.sqrt(this.view.scale)))}px 'JetBrains Mono', monospace`;
        const metrics = ctx.measureText(text);
        const bw = metrics.width + 16;
        const bh = 26;

        ctx.beginPath();
        ctx.roundRect(mid.x - bw / 2, mid.y - bh / 2, bw, bh, 6);
        ctx.fillStyle = isSelected ? '#f59e0b' : '#0f172a';
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffffff' : m.color;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = isSelected ? '#0f172a' : '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, mid.x, mid.y);

        // Poignées de réglage si sélectionnée
        if (isSelected) {
          this.drawHandle(ctx, p1, '#f59e0b');
          this.drawHandle(ctx, p2, '#f59e0b');
          this.drawHandle(ctx, mid, '#38bdf8', 6);
        }

        ctx.restore();
      },

      drawArrow(ctx, pt, angle, size, color) {
        ctx.save();
        ctx.translate(pt.x, pt.y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(size, -size * 0.4);
        ctx.lineTo(size * 0.75, 0);
        ctx.lineTo(size, size * 0.4);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      },

      drawHandle(ctx, pt, color, r = 8) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();
      },

      // Détection de clic sur poignée ou flèche
      hitTest(sx, sy) {
        const rHandle = 20; // Confort tactile
        for (let i = this.measures.length - 1; i >= 0; i--) {
          const m = this.measures[i];
          const p1 = this.toScreen(m.p1);
          const p2 = this.toScreen(m.p2);

          if (Math.hypot(sx - p1.x, sy - p1.y) <= rHandle) return { measure: m, part: 'p1' };
          if (Math.hypot(sx - p2.x, sy - p2.y) <= rHandle) return { measure: m, part: 'p2' };

          // Milieu / Ligne
          const dx = p2.x - p1.x;
          const dy = p2.y - p1.y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len;
          const ny = dx / len;
          const off = m.offset * this.view.scale;
          const mid = { x: (p1.x + p2.x) / 2 + nx * off, y: (p1.y + p2.y) / 2 + ny * off };

          if (Math.hypot(sx - mid.x, sy - mid.y) <= 30) return { measure: m, part: 'body' };
        }
        return null;
      },

      // ÉVÉNEMENTS & INTERACTIONS TACTILES
      bindEvents() {
        const c = this.canvas;

        // Zoom molette
        c.addEventListener('wheel', (e) => {
          e.preventDefault();
          const factor = e.deltaY < 0 ? 1.15 : 0.85;
          this.zoom(e.clientX, e.clientY, factor);
        }, { passive: false });

        // Clic / Touch Start
        const onDown = (clientX, clientY) => {
          const rect = c.getBoundingClientRect();
          const sx = clientX - rect.left;
          const sy = clientY - rect.top;

          // Si en mode tracé de flèche
          if (this.currentTool === 'draw') {
            const imgPt = this.toImage({ x: sx, y: sy });
            if (!this.drawStartPoint) {
              this.drawStartPoint = imgPt;
              this.render();
            } else {
              // Deuxième point : création de la flèche
              this.createMeasure(this.drawStartPoint, imgPt, 35);
              this.drawStartPoint = null;
              this.currentTool = 'select';
              this.drawIndicator.classList.add('hidden');
              document.getElementById('btnToolDraw').classList.remove('bg-emerald-500');
              document.getElementById('btnToolDraw').classList.add('bg-amber-500');
            }
            return;
          }

          // Mode sélection / manipulation
          const hit = this.hitTest(sx, sy);
          if (hit) {
            this.selectMeasure(hit.measure.id);
            this.activeDrag = { measure: hit.measure, part: hit.part };
          } else {
            this.view.isPanning = true;
            this.view.lastX = sx;
            this.view.lastY = sy;
          }
        };

        const onMove = (clientX, clientY) => {
          const rect = c.getBoundingClientRect();
          const sx = clientX - rect.left;
          const sy = clientY - rect.top;

          if (this.view.isPanning) {
            this.view.x += sx - this.view.lastX;
            this.view.y += sy - this.view.lastY;
            this.view.lastX = sx;
            this.view.lastY = sy;
            this.render();
            return;
          }

          if (this.activeDrag) {
            const imgPt = this.toImage({ x: sx, y: sy });
            const m = this.activeDrag.measure;

            if (this.activeDrag.part === 'p1') {
              m.p1 = imgPt;
            } else if (this.activeDrag.part === 'p2') {
              m.p2 = imgPt;
            } else if (this.activeDrag.part === 'body') {
              // Réglage du déport
              const p1 = m.p1;
              const p2 = m.p2;
              const dx = p2.x - p1.x;
              const dy = p2.y - p1.y;
              const len = Math.hypot(dx, dy) || 1;
              const nx = -dy / len;
              const ny = dx / len;
              const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
              m.offset = (imgPt.x - mid.x) * nx + (imgPt.y - mid.y) * ny;
            }
            this.render();
          }
        };

        const onUp = () => {
          this.view.isPanning = false;
          this.activeDrag = null;
        };

        c.addEventListener('mousedown', (e) => onDown(e.clientX, e.clientY));
        window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onUp);

        // Tactile (mobile)
        c.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            onDown(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: false });

        c.addEventListener('touchmove', (e) => {
          e.preventDefault();
          if (e.touches.length === 1) {
            onMove(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: false });

        c.addEventListener('touchend', onUp);

        // Bouton Outil Tracer Flèche
        document.getElementById('btnToolDraw').addEventListener('click', () => {
          this.currentTool = this.currentTool === 'draw' ? 'select' : 'draw';
          this.drawStartPoint = null;
          if (this.currentTool === 'draw') {
            this.drawIndicator.classList.remove('hidden');
            document.getElementById('btnToolDraw').classList.add('bg-emerald-500');
            document.getElementById('btnToolDraw').classList.remove('bg-amber-500');
          } else {
            this.drawIndicator.classList.add('hidden');
            document.getElementById('btnToolDraw').classList.remove('bg-emerald-500');
            document.getElementById('btnToolDraw').classList.add('bg-amber-500');
          }
        });

        // Modèles rapides
        document.getElementById('btnPignonQuick').addEventListener('click', () => this.applyPignonPreset());
        document.getElementById('btnOpeningQuick').addEventListener('click', () => this.applyOpeningPreset());
        document.getElementById('btnAutoDetect').addEventListener('click', () => this.autoDetectContours());
        document.getElementById('btnCenterView').addEventListener('click', () => this.fitImage());

        // Inverser déport de la flèche
        document.getElementById('btnFlipOffset').addEventListener('click', () => {
          const m = this.measures.find(item => item.id === this.selectedId);
          if (m) {
            m.offset = -m.offset;
            this.render();
          }
        });

        // Supprimer flèche
        document.getElementById('btnDeleteMeasure').addEventListener('click', () => this.deleteSelectedMeasure());

        // Saisie au clavier dans le bandeau bas
        this.activeMeasureInput.addEventListener('input', (e) => {
          if (this.selectedId) {
            this.setMeasureValue(this.selectedId, e.target.value);
          }
        });

        this.activeMeasureInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            this.goToNextMeasure();
          }
        });

        // Bouton Suivante
        this.btnNextMeasure.addEventListener('click', () => this.goToNextMeasure());

        // Bouton Dictée vocale
        this.btnVoiceDock.addEventListener('click', () => {
          if (!this.recognition) return;
          try {
            if (this.isListening) this.recognition.stop();
            else this.recognition.start();
          } catch(err) {
            console.error(err);
          }
        });

        // Upload photo & caméra
        const loadImgFile = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (evt) => this.loadImage(evt.target.result);
          reader.readAsDataURL(file);
        };
        document.getElementById('cameraInput').addEventListener('change', loadImgFile);
        document.getElementById('fileInput').addEventListener('change', loadImgFile);

        // Export Haute Résolution
        document.getElementById('btnExport').addEventListener('click', () => this.exportImageWithMeasures());
      },

      zoom(cx, cy, factor) {
        const newScale = Math.max(this.view.minScale, Math.min(this.view.maxScale, this.view.scale * factor));
        const ratio = newScale / this.view.scale;
        this.view.x = cx - (cx - this.view.x) * ratio;
        this.view.y = cy - (cy - this.view.y) * ratio;
        this.view.scale = newScale;
        this.render();
      },

      // Exportation de la photo cotée HD
      exportImageWithMeasures() {
        if (!this.image) return;
        const expCanvas = document.createElement('canvas');
        expCanvas.width = this.imgW;
        expCanvas.height = this.imgH;
        const eCtx = expCanvas.getContext('2d');

        // Fond
        eCtx.drawImage(this.image, 0, 0, this.imgW, this.imgH);

        // Dessin des cotes en coordonnées 1:1
        const originalView = { ...this.view };
        this.view.x = 0;
        this.view.y = 0;
        this.view.scale = 1;

        this.measures.forEach(m => this.drawMeasure(eCtx, m, false));
        this.view = originalView;

        const a = document.createElement('a');
        a.download = `metre_facade_${Date.now()}.png`;
        a.href = expCanvas.toDataURL('image/png');
        a.click();
        this.showToast("Image cotée exportée avec succès !");
      },

      showToast(text) {
        this.statusToastText.textContent = text;
        this.statusToast.classList.remove('hidden');
        setTimeout(() => this.statusToast.classList.add('hidden'), 3500);
      }
    };

    window.addEventListener('DOMContentLoaded', () => App.init());
  </script>
</body>
