<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Métré Façade Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* BARRE D'OUTILS HAUTE */
    header {
      background: #1e293b;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      overflow-x: auto;
      border-bottom: 2px solid #334155;
      flex-shrink: 0;
      z-index: 10;
    }
    .btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn-photo { background: #2563eb; border-color: #60a5fa; }
    .btn-reset { background: #d97706; border-color: #f59e0b; }
    .btn-del { background: #dc2626; border-color: #ef4444; }
    .btn-export { background: #059669; border-color: #10b981; }

    /* ZONE AFFICHAGE PRINCIPALE */
    #main-area {
      flex: 1 1 auto;
      position: relative;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 0;
    }
    #stage {
      position: relative;
      touch-action: none;
      box-shadow: 0 0 25px rgba(0,0,0,0.8);
      background: #1e293b;
    }
    #bg-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* BANDEAU BAS PERMANENT DE SAISIE */
    #bottom-dock {
      background: #1e293b;
      border-top: 3px solid #facc15;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      z-index: 10;
    }
    .dock-row-1 {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-id {
      background: #facc15;
      color: #000;
      font-weight: 900;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 8px;
      min-width: 75px;
      text-align: center;
    }
    .val-input {
      flex: 1;
      background: #0f172a;
      border: 2px solid #facc15;
      border-radius: 8px;
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      padding: 8px;
      outline: none;
    }
    .val-input:focus { border-color: #60a5fa; box-shadow: 0 0 10px rgba(96,165,250,0.4); }
    .btn-mic {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-mic.listening {
      background: #16a34a;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; transform: scale(1.03); } }

    .dock-row-2 {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-nav {
      background: #334155;
      border: 1px solid #64748b;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .counter-info {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <label class="btn btn-photo">
      📷 Changer Photo
      <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">
    </label>
    <button class="btn btn-reset" id="btn-reset">⚡ Réinitialiser Cotes</button>
    <button class="btn" id="btn-add-win">+ Fenêtre</button>
    <button class="btn" id="btn-add-free">+ Cote Libre</button>
    <button class="btn btn-del" id="btn-del">🗑️ Suppr</button>
    <button class="btn btn-export" id="btn-export">💾 Exporter Image</button>
  </header>

  <div id="main-area">
    <div id="stage">
      <img id="bg-img" alt="Façade">
      <canvas id="canvas-overlay"></canvas>
    </div>
  </div>

  <div id="bottom-dock">
    <div class="dock-row-1">
      <div class="badge-id" id="badge-id">#1</div>
      <input type="text" id="input-val" class="val-input" placeholder="Ex: 325 ou 3.25" inputmode="decimal">
      <button class="btn-mic" id="btn-mic">🎤 Dicter</button>
    </div>
    <div class="dock-row-2">
      <button class="btn-nav" id="btn-prev">⬅️ Précédente</button>
      <div class="counter-info" id="counter-info">1 / 1 cotes</div>
      <button class="btn-nav" id="btn-next">Suivante ➡️</button>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const bgImg = document.getElementById('bg-img');
    const canvas = document.getElementById('canvas-overlay');
    const ctx = canvas.getContext('2d');
    const mainArea = document.getElementById('main-area');

    let arrows = [];
    let selectedId = null;
    let draggingHandle = null;
    let arrowCounter = 1;
    let isDrawingFree = false;
    let freeStart = null;
    let freeMode = false;

    // Image par défaut (maquette vectorielle nette dès l'ouverture)
    const defaultFaçadeSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
      <rect width="800" height="600" fill="#f1f5f9"/>
      <path d="M120 500 L120 280 L400 100 L680 280 L680 500 Z" fill="#e2e8f0" stroke="#334155" stroke-width="4"/>
      <!-- Fenêtres Étage -->
      <rect x="220" y="210" width="90" height="110" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
      <rect x="490" y="210" width="90" height="110" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
      <!-- Fenêtres / Baie RDC -->
      <rect x="220" y="370" width="100" height="110" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
      <rect x="470" y="350" width="130" height="150" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
      <!-- Soubassement -->
      <rect x="120" y="470" width="560" height="30" fill="#cbd5e1" stroke="#334155" stroke-width="2"/>
    </svg>`;

    function loadSVGDefault() {
      bgImg.src = "data:image/svg+xml;utf8," + encodeURIComponent(defaultFaçadeSVG);
      bgImg.onload = () => {
        fitStage();
        initDefaultPrequote();
        render();
        updateDock();
      };
    }

    // Chargement photo client
    document.getElementById('file-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        bgImg.onload = () => {
          fitStage();
          initDefaultPrequote();
          render();
          updateDock();
        };
        bgImg.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function fitStage() {
      const pad = 20;
      const maxW = mainArea.clientWidth - pad;
      const maxH = mainArea.clientHeight - pad;
      const nw = bgImg.naturalWidth || 800;
      const nh = bgImg.naturalHeight || 600;
      const scale = Math.min(maxW / nw, maxH / nh);

      const fw = Math.round(nw * scale);
      const fh = Math.round(nh * scale);

      stage.style.width = fw + 'px';
      stage.style.height = fh + 'px';
      canvas.width = fw;
      canvas.height = fh;
    }

    window.addEventListener('resize', () => {
      if (!bgImg.src) return;
      const oldW = canvas.width || 1;
      const oldH = canvas.height || 1;
      fitStage();
      const rw = canvas.width / oldW;
      const rh = canvas.height / oldH;
      arrows.forEach(a => {
        a.p1.x *= rw; a.p1.y *= rh;
        a.p2.x *= rw; a.p2.y *= rh;
      });
      render();
    });

    // Pré-cotation conforme terrain (zéro rampant, cotes utiles)
    function initDefaultPrequote() {
      arrows = [];
      arrowCounter = 1;
      const w = canvas.width;
      const h = canvas.height;

      // 1. Longueur basse de la façade
      addArrow(w * 0.15, h * 0.85, w * 0.85, h * 0.85, 'red', '');

      // 2. Hauteur Egout Gauche
      addArrow(w * 0.15, h * 0.85, w * 0.15, h * 0.46, 'blue', '');

      // 3. Hauteur Faîtage / Cintre central (verticale pure)
      addArrow(w * 0.50, h * 0.85, w * 0.50, h * 0.16, 'blue', '');

      // 4. Hauteur Egout Droit
      addArrow(w * 0.85, h * 0.85, w * 0.85, h * 0.46, 'blue', '');

      // 5. Ouvertures Étage
      addWindowCotes(w * 0.27, h * 0.35, w * 0.12, h * 0.18);
      addWindowCotes(w * 0.61, h * 0.35, w * 0.12, h * 0.18);

      // 6. Ouvertures RDC
      addWindowCotes(w * 0.27, h * 0.62, w * 0.13, h * 0.18);
      addWindowCotes(w * 0.59, h * 0.58, w * 0.16, h * 0.25);

      selectedId = arrows[0] ? arrows[0].id : null;
    }

    function addWindowCotes(x, y, w, h) {
      addArrow(x, y - 8, x + w, y - 8, 'red', '');
      addArrow(x + w + 8, y, x + w + 8, y + h, 'blue', '');
    }

    function addArrow(x1, y1, x2, y2, color, val) {
      arrows.push({
        id: arrowCounter++,
        p1: { x: x1, y: y1 },
        p2: { x: x2, y: y2 },
        color: color || 'red',
        value: val || ''
      });
      selectedId = arrows[arrows.length - 1].id;
    }

    document.getElementById('btn-reset').addEventListener('click', () => {
      initDefaultPrequote();
      render();
      updateDock();
    });

    document.getElementById('btn-add-win').addEventListener('click', () => {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      addWindowCotes(cx - 35, cy - 40, 70, 80);
      render();
      updateDock();
    });

    document.getElementById('btn-add-free').addEventListener('click', () => {
      freeMode = true;
      alert("Glissez votre doigt sur la façade pour positionner la cote.");
    });

    document.getElementById('btn-del').addEventListener('click', () => {
      if (!selectedId) return;
      arrows = arrows.filter(a => a.id !== selectedId);
      selectedId = arrows.length ? arrows[0].id : null;
      render();
      updateDock();
    });

    // RENDU VISUEL
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      arrows.forEach(arr => {
        const isSel = (arr.id === selectedId);
        const { p1, p2, color, value } = arr;
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const headlen = 11;

        ctx.save();
        ctx.strokeStyle = isSel ? '#ffffff' : (color === 'blue' ? '#3b82f6' : '#ef4444');
        ctx.lineWidth = isSel ? 3.5 : 2.5;

        // Ligne
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();

        // Pointes flèche
        drawTip(p1.x, p1.y, angle + Math.PI, headlen);
        drawTip(p2.x, p2.y, angle, headlen);

        // Poignées extrémités
        ctx.fillStyle = isSel ? '#facc15' : '#ffffff';
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, 6, 0, Math.PI * 2);
        ctx.arc(p2.x, p2.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Étiquette Jaune fluo
        const midX = (p1.x + p2.x) / 2;
        const midY = (p1.y + p2.y) / 2;
        const text =
